# =================================================================
# Основные настройки
# =================================================================
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# log_type error|warning|notice|information".
log_type all

#tls_version tlsv1.3

listener 1883 0.0.0.0

allow_anonymous true
