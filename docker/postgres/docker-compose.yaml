volumes:
  postgres_data:

services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: postgres
    restart: unless-stopped
    user: 1000:1000
    environment:
      POSTGRES_DB: homelab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homelab"]
      interval: 10s
      timeout: 5s
      retries: 5
