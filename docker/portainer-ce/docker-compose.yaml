volumes:
  portainer_data:

services:
  portainer-ce:
    image: portainer/portainer-ce:2.45.0-alpine
    container_name: portainer-ce
    command:
      - "--sslcert"
      - "/etc/letsencrypt/live/[YOUR_DOMAIN]/portainer.crt"
      - "--sslkey"
      - "/etc/letsencrypt/live/[YOUR_DOMAIN]/portainer.key"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - portainer_data:/data
    ports:
      - 9000:9000
      - 9443:9443
    healthcheck:
      test: ["CMD-SHELL", "curl http://127.0.0.1:9000"]
      interval: 10s
      timeout: 5s
      retries: 5
